# The lab cluster "c2": the board on Longhorn, two routes that send tasks to cela (formerly pi-durable-k8s) in cela-dev:
# `dev` (one channel, one profile) and `agents/` (a channel subtree, where the channel under it picks the profile), and
# GitHub webhooks from gscode1/pi-tick through the public Gateway (argo-c2 docs/public-exposure.md).
# Create the Secrets first (docs/deployment.md). Pin image.tag to a sha from the image workflow.
image:
  tag: f60c269
  pullPolicy: IfNotPresent

board:
  persistence:
    storageClass: longhorn
    size: 5Gi
  tokens:
    existingSecret: boardhand-board-tokens
    key: tokens
  # The public Gateway's proxy reaches the board for POST /hooks/github only (its HTTPRoute matches nothing else).
  ingress:
    from:
      - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system } }
        podSelector: { matchLabels: { gateway.envoyproxy.io/owning-gateway-name: public } }
  # Renovate on pi-tick runs with gscode1's token, so its PRs are gscode1's and it labels them `renovate` itself.
  # `labeled` fires once per PR; pushes to the PR (`synchronize`) are left out so a rebase does not start another run.
  # The namespace must carry gateway.gskode.com/public=true for the route to attach to Gateway `public`.
  github:
    webhookSecret: { name: boardhand-github-webhook, key: secret }
    httpRoute:
      enabled: true
      hostnames: [hooks.gskode.com]
      parentRefs:
        - { group: gateway.networking.k8s.io, kind: Gateway, name: public, namespace: envoy-gateway-system, sectionName: http }
    triggers:
      - name: pi-tick-renovate
        repos: [gscode1/pi-tick]
        event: pull_request
        actions: [labeled]
        when:
          label.name: [renovate]
          sender.login: [gscode1]
        channel: agents/renovate
        labels: { source: renovate }
        text: |
          Renovate opened {{pull_request.html_url}} in {{repository.full_name}}: {{pull_request.title}}
          Branch {{pull_request.head.ref}} into {{pull_request.base.ref}}.

          {{pull_request.body}}

# The board's UI at board.c2.lab through the lab Gateway (no authentication yet: ADR 0007). Needs the Secret
# `boardhand-inspector`, key `token`, holding an owner token (docs/deployment.md).
inspector:
  enabled: true
  tokenSecret: { name: boardhand-inspector, key: token }
  httpRoute:
    enabled: true
    hostnames: [board.gskode.com, board.c2.lab]
    parentRefs:
      - { name: main, namespace: envoy-gateway-system, sectionName: http }
      - { name: main, namespace: envoy-gateway-system, sectionName: https-c2-lab }
      - { name: main, namespace: envoy-gateway-system, sectionName: https-gskode }
  allowFrom:
    - namespace: envoy-gateway-system
      podSelector: { app.kubernetes.io/name: envoy }

routes:
  - name: dev
    channel: dev
    # Owner principal IDs: the `person` entries of the tokens file, as boardhand:person:<name>.
    from: ["boardhand:person:gs"]
    backend: pi
    backendOptions:
      url: http://pi-ingest.cela-dev.svc:8080
      profile: coding
      deleteOnFinish: true
    concurrency: 1
    boardTokenSecret: { name: boardhand-worker-dev, key: token }
    backendTokenSecret: { name: boardhand-pi, key: token }
    egress:
      # pi-ingest's Service port is 8080 and so is its container port.
      - namespace: cela-dev
        podSelector: { app.kubernetes.io/name: pi-ingest }
        ports: [8080]
  # A subtree route: tasks in agents/research or agents/coding/x run with the profile research or coding. Adding a
  # channel, or a profile in pi, needs no redeploy (ADR 0006): `profiles: "*"` accepts any profile pi has; a list
  # would need a redeploy to grow. The board token of this worker must be scoped
  # `agents/` in the tokens file. Leave model and sandboxSize out: they would override each profile's defaults.
  - name: agents
    channel: agents/
    # boardhand:source:github: tasks the GitHub webhook creates (ADR 0008), here in agents/renovate.
    from: ["boardhand:person:gs", "boardhand:source:github"]
    backend: pi
    backendOptions:
      url: http://pi-ingest.cela-dev.svc:8080
      profileChannel: agents/
      profiles: "*"
      deleteOnFinish: true
    concurrency: 2
    boardTokenSecret: { name: boardhand-worker-agents, key: token }
    backendTokenSecret: { name: boardhand-pi, key: token }
    egress:
      - namespace: cela-dev
        podSelector: { app.kubernetes.io/name: pi-ingest }
        ports: [8080]
