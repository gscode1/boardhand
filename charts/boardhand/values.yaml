# Defaults for the boardhand chart. The chart holds no secret values: every token comes from a Secret you create
# (docs/deployment.md has the kubectl commands).

image:
  repository: ghcr.io/gscode1/boardhand
  # A short git sha from the image workflow (immutable), or `main` (moves; pair it with pullPolicy: Always).
  tag: main
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The board server (`node dist/server/main.js`): one replica on a PVC, never more (ADR 0005).
board:
  enabled: true
  # The URL everyone uses to reach the board; the engine checks it as the token audience. Workers use it as BOARD_URL.
  # Empty: http://<release>-board.<namespace>.svc:8080
  publicUrl: ""
  persistence:
    storageClass: "" # empty: the cluster's default class
    size: 5Gi
  tokens:
    # Required. A Secret holding the tokens file: one `name:kind:token[:channels]` per line (docs/configuration.md).
    existingSecret: ""
    key: tokens
  stale:
    # Log a task.stale warning for each task ready longer than afterSeconds, every checkSeconds (0 turns it off).
    checkSeconds: 60
    afterSeconds: 900
  # Who besides the workers may reach the board, as raw NetworkPolicy `from` entries, for example your ingress
  # controller or the pods of whoever posts tasks:
  #   - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress } }
  ingress:
    from: []
  # GitHub webhook triggers (ADR 0008, docs/configuration.md): each turns a matching GitHub event into a task. Empty:
  # no triggers file, no secret, and POST /hooks/github answers 404. To reach it from GitHub, enable httpRoute below
  # (and list that gateway's proxy pods in board.ingress.from).
  # Example (a Renovate PR):
  #   - name: renovate
  #     repos: ["acme/*"]
  #     event: pull_request
  #     actions: [opened, synchronize]
  #     when: { pull_request.user.login: ["renovate[bot]"] }   # a who-gate is mandatory
  #     channel: agents/deps
  #     labels: { kind: renovate }
  #     text: "Check Renovate's update {{pull_request.html_url}}: {{pull_request.title}}"
  github:
    triggers: []
    # Required when triggers is set: an existing Secret holding the webhook's secret (becomes GITHUB_WEBHOOK_SECRET).
    webhookSecret: { name: "", key: secret }
    # Optional Gateway API HTTPRoute for the webhook. It routes only `POST /hooks/github` (exact path) to the board
    # Service, nothing else of the board. It renders only when triggers is set and enabled is true. parentRefs should
    # name a Gateway that serves only public routes, not the one that fronts internal services.
    httpRoute:
      enabled: false
      hostnames: [] # e.g. [hooks.example.com]
      parentRefs: [] # the Gateway reachable from GitHub, e.g. a public gateway behind a tunnel
  # With board.enabled false (a board elsewhere): where the workers' egress to it goes, in the route egress shape.
  egress: []
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  tolerations: []
  affinity: {}

# The board's own UI, the SDK's inspector (`node dist/server/inspect.js`), behind a Gateway API HTTPRoute (ADR 0007).
# It has NO authentication: it acts as the owner whose token is in tokenSecret, and whoever reaches it acts as that
# owner. Keep it on an internal hostname until a gateway auth policy is in front of it.
inspector:
  enabled: false
  # Required when enabled: a Secret with an owner (`person`) token of the board's tokens file.
  tokenSecret: { name: "", key: token }
  port: 4747
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
  httpRoute:
    enabled: false
    # Raw Gateway API parentRefs and hostnames, for example:
    #   parentRefs: [{ name: main, namespace: envoy-gateway-system, sectionName: http }]
    #   hostnames: [board.example.lab]
    parentRefs: []
    hostnames: []
  # Who may connect to the inspector's port, in the shape of a route egress entry minus ports: the gateway's proxy pods,
  # for example [{ namespace: envoy-gateway-system, podSelector: { app.kubernetes.io/name: envoy } }].
  allowFrom: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# One worker Deployment per entry. All fields are validated when the chart renders.
#
# routes:
#   - name: dev                        # DNS label; names the Deployment, ServiceAccount and NetworkPolicy
#     channel: dev                     # BOARDHAND_CHANNEL: a channel, or a subtree such as agents/ (ADR 0006)
#     labels: { team: web }            # BOARDHAND_LABELS: a task must carry all of them
#     from: ["boardhand:person:gs"]    # BOARDHAND_FROM: owner principal IDs (required, never empty)
#     backend: pi                      # BOARDHAND_BACKEND
#     backendOptions: { url: "http://pi-ingest.pi-durable-poc.svc:8080" }
#     concurrency: 1                   # BOARDHAND_CONCURRENCY
#     lease: 300                       # BOARDHAND_LEASE, seconds
#     wait: 30                         # BOARDHAND_WAIT, seconds
#     profile: boardhand               # BOARD_PROFILE
#     boardTokenSecret: { name: boardhand-worker-dev, key: token }     # becomes BOARD_TOKEN
#     backendTokenSecret: { name: boardhand-pi, key: token }           # becomes PI_TOKEN (the backend's token env)
#     egress:                          # on top of DNS and the board
#       - { namespace: pi-durable-poc, podSelector: { app.kubernetes.io/name: pi-ingest }, ports: [8080] }
#       - { cidr: 203.0.113.0/24, ports: [443] }
#     resources: {}
#     terminationGracePeriodSeconds: 30
routes: []

worker:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
  nodeSelector: {}
  tolerations: []
  affinity: {}

networkPolicy:
  # Default deny for the release's pods, then: board ingress from workers and board.ingress.from; worker egress to DNS,
  # the board and the route's egress. Needs a CNI that enforces NetworkPolicy.
  enabled: true
  dns:
    namespace: kube-system
    podSelector:
      k8s-app: kube-dns
